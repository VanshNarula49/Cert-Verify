<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification</title>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
        }
        .container {
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        .logo {
            width: 100px;
            height: 100px;
            background-image: url('/logo.png'); /* Replace 'robify_logo.png' with your logo file path */
            background-size: cover;
            background-position: center;
            margin: 0 auto 20px; /* Center the logo horizontally */
            animation: bounce 2s infinite alternate; /* Example animation */
        }
        .icons {
            font-size: 48px;
            color: #007bff;
            margin-bottom: 20px;
            animation: rotate 2s linear infinite; /* Example animation */
        }
        .buttons {
            display: flex;
            justify-content: center;
            animation: fadeInUp 2s ease-in-out;
        }
        .button {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 20px 40px;
            font-size: 20px;
            cursor: pointer;
            margin: 0 10px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #0056b3;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes fadeInUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes bounce {
            to {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="icons">
            <i class="fas fa-certificate"></i>
        </div>
        <div class="buttons">
            <button class="button" onclick="window.location.href = '/validate';">Validate Your Certificate</button>
            <button class="button" onclick="window.location.href = '/verify';">Verify Your Certificate</button>
        </div>
    </div>

    <!-- Font Awesome Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
</body>
</html>
